# Every action is pinned to a full commit SHA; the trailing comment names the tag.
# Change the SHA and the comment together.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pytest

  js:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: python -m pip install --require-hashes -r requirements.lock
      # The parity tests of the engine read the full set of fixtures, which git ignores: made here with the seed the tests were written for.
      - run: python -m trioforge.export.fixtures --out build/fixtures --seed 20261014
        env:
          PYTHONPATH: pipeline
      - run: npm test
        env:
          TRIOFORGE_FULL_FIXTURES: "1"

  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The whole history is needed: the scan reads every commit, not only the checked-out tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Nothing is installed: the scanner uses only the standard library.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # This job never has the privacy key, and no workflow may: any code that reaches this
      # repository can read a CI secret, and the published digests would then become a
      # dictionary of names. Here run only the checks that need no key: log shapes, paths into a
      # user profile, program-file words, archives, PDFs, LFS pointers and submodules, in every
      # file and in all of history. The denylist is checked on the maintainer's computer, by
      # the git hooks, before anything is pushed.
      - name: Privacy scan, checks that need no key
        run: python -m trioforge.privacy.scan --all --history
        env:
          PYTHONPATH: pipeline
      # Who made each commit, and in which time zone. Only on a push to main: for a pull request
      # actions/checkout builds a merge commit authored by GitHub, which would never pass.
      # The allowed address is in the committed file privacy/identity.txt.
      - name: Privacy scan, commit identity
        if: github.event_name == 'push'
        run: python -m trioforge.privacy.scan --identity-file privacy/identity.txt
        env:
          PYTHONPATH: pipeline
